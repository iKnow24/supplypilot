name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  optimizer:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/optimizer } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  seed-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 data/seed/generate_seed.py && git diff --exit-code data/seed/demo_catalog.json

  # docs/openapi.json and the web app's generated TS types must match the optimizer's models.
  api-contract-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: uv sync
        working-directory: services/optimizer
      - run: npm ci
        working-directory: apps/web
      - run: make api-types && git diff --exit-code docs/openapi.json apps/web/src/lib/optimizer/api-types.ts
