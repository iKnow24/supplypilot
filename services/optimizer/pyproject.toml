[project]
name = "supplypilot-optimizer"
version = "0.1.0"
description = "SupplyPilot total-delivered-cost optimizer service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "ortools>=9.15.6755",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
supplypilot-optimizer = "supplypilot_optimizer:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.vercel]
# Vercel deploy (docs/deployment.md): main.py re-exports the app; the build step bundles
# the repo-level catalog next to the service.
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python vercel_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
